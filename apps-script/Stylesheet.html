<style>
/* LAEMU Stundenrapport – Gestaltung nach den Brand Guidelines
   Klangschwarz #000000 · Bühnenweiss #FFFFFF · Silbergrau #EFEFEF
   Klanggold #BC8C33 · Steingrau #505050
   Schrift: Radona Norm (Markenschrift, falls installiert), sonst Figtree. */
@import url('https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Caveat:wght@400..700&display=swap');

:root {
  --black: #000000;
  --white: #FFFFFF;
  --silver: #EFEFEF;
  --gold: #BC8C33;
  --stone: #505050;
  --line: #E3E3E3;
  --line-strong: #C9C9C9;
  --radius: 8px;
  --radius-lg: 14px;
  --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 12px 32px rgba(0, 0, 0, .06);
  --font: 'Radona Norm', 'Figtree', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --font-deco: 'Golden Hopes', 'Caveat', 'Segoe Script', cursive;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--silver);
  color: var(--black);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.page {
  max-width: 720px;
  margin: 0 auto;
  padding: 40px 20px 64px;
}

/* ---------- Kopf ---------- */
.brand { text-align: center; margin-bottom: 28px; }
.brand svg { width: 190px; height: auto; color: var(--black); display: inline-block; }
.brand .claim {
  font-style: italic;
  color: var(--stone);
  font-size: 14px;
  margin-top: 10px;
  letter-spacing: .01em;
}

/* ---------- Tagesspruch ---------- */
.quote {
  text-align: center;
  margin: 0 auto 32px;
  max-width: 560px;
}
.quote .mark {
  display: block;
  width: 34px;
  height: auto;
  margin: 0 auto 12px;
  color: var(--gold);
}
.quote p {
  font-family: var(--font-deco);
  font-size: 30px;
  line-height: 1.25;
  color: var(--gold);
  margin: 0 0 8px;
}
.quote .author {
  font-size: 12px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--stone);
}

/* ---------- Karte ---------- */
.card {
  background: var(--white);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  padding: 8px 28px 28px;
}

.block { padding: 24px 0; border-bottom: 1px solid var(--line); }
.block:last-of-type { border-bottom: 0; }
.block-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
.step {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .1em;
  color: var(--gold);
  min-width: 18px;
}
.block h2 { font-size: 17px; font-weight: 800; margin: 0; letter-spacing: -.01em; }
.block .hint { font-size: 13px; color: var(--stone); margin: -6px 0 14px 30px; }

label, .label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--stone);
  margin-bottom: 6px;
}

input[type="date"], input[type="time"], input[type="number"], input[type="text"] {
  width: 100%;
  font-family: var(--font);
  font-size: 16px;
  color: var(--black);
  background: var(--white);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  padding: 12px 14px;
  transition: border-color .15s ease, box-shadow .15s ease;
}
input:focus {
  outline: none;
  border-color: var(--black);
  box-shadow: 0 0 0 3px rgba(188, 140, 51, .22);
}
input[readonly] { background: var(--silver); color: var(--stone); }

/* ---------- Auswahl-Pillen ---------- */
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill {
  font-family: var(--font);
  font-size: 14px;
  font-weight: 600;
  color: var(--black);
  background: var(--white);
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  padding: 9px 18px;
  cursor: pointer;
  transition: all .15s ease;
}
.pill:hover { border-color: var(--black); }
.pill[aria-pressed="true"] {
  background: var(--black);
  border-color: var(--black);
  color: var(--white);
}
.pill.gold[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); }
.pill.small { font-size: 13px; padding: 7px 14px; font-weight: 500; }

.default-note { font-size: 12px; color: var(--stone); margin-top: 10px; }
.default-note strong { color: var(--black); }

/* ---------- Datum ---------- */
.date-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.date-row .field { flex: 1 1 220px; }
.date-meta { margin-top: 10px; font-size: 13px; color: var(--stone); }
.date-meta .tagday {
  display: inline-block;
  background: var(--silver);
  border-radius: 999px;
  padding: 3px 12px;
  margin-right: 6px;
  font-weight: 600;
  color: var(--black);
}
.date-meta .tagday.gold { background: rgba(188, 140, 51, .16); color: #7d5c18; }

/* ---------- Projekt- und Abwesenheitsblöcke ---------- */
.entry {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  background: var(--white);
}
.entry.absence { background: #FBF8F2; border-color: #EADFC8; }
.entry-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.entry-title { font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--stone); }
.times { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-top: 14px; }
.times .field { flex: 1 1 130px; }
.times .result {
  flex: 0 0 auto;
  min-width: 92px;
  text-align: right;
  padding-bottom: 12px;
}
.times .result .value { font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
.times .result .unit { font-size: 12px; color: var(--stone); }

.note-field { margin-top: 12px; }

.icon-btn {
  border: 0;
  background: transparent;
  color: var(--stone);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  padding: 4px 6px;
  border-radius: 6px;
}
.icon-btn:hover { color: var(--black); background: var(--silver); }

.linkish {
  border: 0;
  background: transparent;
  color: var(--black);
  font-family: var(--font);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  padding: 6px 0;
  border-bottom: 2px solid var(--gold);
  border-radius: 0;
}
.linkish:hover { color: var(--gold); }
.linkish.subtle { font-weight: 600; font-size: 13px; color: var(--stone); border-bottom-color: var(--line-strong); }
.linkish.subtle:hover { color: var(--black); border-bottom-color: var(--gold); }
.actions-row { display: flex; justify-content: space-between; align-items: center; gap: 10px 20px; flex-wrap: wrap; margin-top: 4px; }
.actions-row .linkish { flex: 0 1 auto; text-align: left; }

/* ---------- Pause ---------- */
.pause-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.pause-row .field { flex: 0 0 130px; }
.pause-row .pills { flex: 1 1 auto; padding-bottom: 6px; }

/* ---------- Zusammenfassung ---------- */
.summary { background: var(--black); color: var(--white); border-radius: var(--radius-lg); padding: 22px 24px; margin-top: 8px; }
.summary h3 { margin: 0 0 16px; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: rgba(255, 255, 255, .6); font-weight: 700; }
.summary-line { display: flex; justify-content: space-between; padding: 7px 0; font-size: 14px; color: rgba(255, 255, 255, .78); }
.summary-line span:last-child { font-variant-numeric: tabular-nums; color: var(--white); font-weight: 600; }
.summary-total {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  border-top: 1px solid rgba(255, 255, 255, .18);
  margin-top: 12px;
  padding-top: 16px;
}
.summary-total .lbl { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: rgba(255, 255, 255, .7); }
.summary-total .val { font-size: 34px; font-weight: 800; letter-spacing: -.03em; color: var(--gold); font-variant-numeric: tabular-nums; }
.summary-total .val small { font-size: 15px; font-weight: 600; margin-left: 4px; color: rgba(255, 255, 255, .6); }

/* ---------- Submit ---------- */
.submit {
  width: 100%;
  margin-top: 22px;
  background: var(--black);
  color: var(--white);
  font-family: var(--font);
  font-size: 16px;
  font-weight: 700;
  border: 0;
  border-radius: var(--radius);
  padding: 18px 24px;
  cursor: pointer;
  transition: background .15s ease, transform .1s ease;
}
.submit:hover { background: #1c1c1c; }
.submit:active { transform: translateY(1px); }
.submit[disabled] { background: var(--line-strong); cursor: not-allowed; }

.errors {
  margin-top: 16px;
  border-left: 3px solid var(--gold);
  background: #FBF6EC;
  padding: 14px 16px;
  border-radius: 0 var(--radius) var(--radius) 0;
  font-size: 14px;
}
.errors ul { margin: 6px 0 0; padding-left: 18px; }
.errors li { margin: 3px 0; }

/* ---------- Kennzahlen ---------- */
.stats { margin-top: 26px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat {
  background: var(--white);
  border-radius: var(--radius-lg);
  padding: 20px 22px;
  box-shadow: var(--shadow);
}
.stat .k { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--stone); }
.stat .v { font-size: 32px; font-weight: 800; letter-spacing: -.03em; margin-top: 8px; font-variant-numeric: tabular-nums; }
.stat .v.gold { color: var(--gold); }
.stat .s { font-size: 12px; color: var(--stone); margin-top: 6px; }
.stat.wide { grid-column: 1 / -1; }

.reminder {
  margin-top: 12px;
  background: var(--white);
  border-left: 3px solid var(--gold);
  border-radius: 0 var(--radius) var(--radius) 0;
  padding: 14px 18px;
  font-size: 13.5px;
  color: var(--stone);
  box-shadow: var(--shadow);
}
.reminder strong { color: var(--black); }

.foot { text-align: center; margin-top: 34px; font-size: 12px; color: var(--stone); }

/* ---------- Erfolgsmeldung ---------- */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(239, 239, 239, .96);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  z-index: 50;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s ease;
}
.overlay.show { opacity: 1; pointer-events: auto; }
.overlay-inner {
  background: var(--white);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  padding: 44px 34px 34px;
  max-width: 460px;
  width: 100%;
  text-align: center;
  transform: translateY(10px);
  transition: transform .25s ease;
}
.overlay.show .overlay-inner { transform: translateY(0); }
.overlay-inner .wave { width: 74px; color: var(--gold); margin-bottom: 18px; }
.overlay-inner h2 { font-size: 30px; font-weight: 800; margin: 0 0 8px; letter-spacing: -.02em; }
.overlay-inner p { color: var(--stone); margin: 0 0 6px; font-size: 15px; }
.overlay-inner .recap {
  margin: 22px 0 6px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  padding: 16px 0;
}
.overlay-inner .recap div { display: flex; justify-content: space-between; font-size: 14px; padding: 4px 0; }
.overlay-inner .recap span:last-child { font-weight: 700; font-variant-numeric: tabular-nums; }
.overlay-inner .again { margin-top: 22px; }

.busy { opacity: .55; pointer-events: none; }
.spinner-line { height: 2px; background: linear-gradient(90deg, var(--gold), transparent); animation: slide 1s linear infinite; border-radius: 2px; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

@media (max-width: 560px) {
  .page { padding: 28px 14px 48px; }
  .card { padding: 4px 18px 22px; }
  .quote p { font-size: 25px; }
  .stats { grid-template-columns: 1fr; }
  .summary-total .val { font-size: 30px; }
}
</style>
